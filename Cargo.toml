[package]
name = "rogue-server"
version = "0.1.0"
edition = "2024"
default-run = "rogue-server"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
futures-util = "0.3"
tokio-tungstenite = "0.29"
