version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
